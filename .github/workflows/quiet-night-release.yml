name: Quiet Night release

on:
  workflow_run:
    workflows:
      - Quiet Night CI
    types:
      - completed

concurrency:
  group: quiet-night-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish Quiet Night APK
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download tested Quiet Night build
        uses: actions/download-artifact@v7
        with:
          name: quiet-night-build
          path: quiet-night/artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked release tooling
        run: npm ci --prefix .github/release

      - name: Bootstrap Quiet Night version history
        run: .github/release/bootstrap-version-tag.sh quiet-night-v

      - name: Publish release
        working-directory: quiet-night
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_RELEASE_BIN: ${{ github.workspace }}/.github/release/node_modules/.bin/semantic-release
        run: '"$SEMANTIC_RELEASE_BIN"'
