name: CRAP score tool CI

on:
  push:
    branches:
      - main
    paths:
      - tools/**
  pull_request:
    paths:
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test CRAP score tool
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: tools/global.json

      - name: Test
        run: >-
          dotnet test tools/CrapScore.Tests/CrapScore.Tests.csproj
          --configuration Release
