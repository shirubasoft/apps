name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: notify-classifier
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: notify-classifier/global.json

      - name: Set up shared tool runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Check semantic version tag
        shell: bash
        run: |
          project_version="$(dotnet msbuild src/NotifyClassifier.App/NotifyClassifier.App.csproj -getProperty:VersionPrefix -nologo)"
          test "v$project_version" = "$GITHUB_REF_NAME"

      - name: Build, test, and package
        run: ./build.sh

      - name: Publish GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "artifacts/NotifyClassifier.apk#NotifyClassifier.apk"
          --generate-notes
